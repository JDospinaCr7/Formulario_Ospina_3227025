<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        
        
        <header class="form-header">
            <h2>Registro de Usuario</h2>
        </header>

        <form action="#" method="POST">
            
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>

            <div class="form-group">
                <label for="tipo_documento">Tipo de Documento:</label>
                <select id="tipo_documento" name="tipo_documento" required>
                    <option value="">Seleccione...</option>
                    <option value="cc">Cédula de Ciudadanía</option>
                    <option value="ti">Tarjeta de Identidad</option>
                    <option value="ce">Cédula de Extranjería</option>
                    <option value="pasaporte">Pasaporte</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dni">DNI / Número de Documento:</label>
                <input type="number" id="dni" name="dni" required>
            </div>

            <div class="form-group">
                <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
            </div>

            <div class="form-group">
                <label for="telefono">Número de Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="pais">País Domicilio:</label>
                <input type="text" id="pais" name="pais" required>
            </div>

            <div class="form-group">
                <label for="ciudad">Ciudad Domicilio:</label>
                <input type="text" id="ciudad" name="ciudad" required>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="tratamiento_datos" name="tratamiento_datos" required>
                <label for="tratamiento_datos">Acepto el tratamiento de datos personales</label>
            </div>

            <button type="submit" class="submit-btn">Enviar Datos</button>

        </form>
    </div>
</body>
</html>
